<!doctype html>
<html lang="nb" data-theme="carbon">
<head>
<meta charset="utf-8">
<title>Uten nett — Hverdagsverktøy</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070504">
<script>
  (function(){try{var t=localStorage.getItem('hvt-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="/shared/themes.css?v=v11">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg,#070504);color:var(--ink,#edebe7);font:15px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;padding:32px 20px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(26px,4.4vw,36px);line-height:1.1;margin:0 0 14px}
p{color:var(--ink2,#a59f98);margin:0 0 12px}
.knapper{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
button,a.knapp{font:inherit;font-weight:500;padding:10px 18px;border-radius:8px;border:1px solid var(--line,#3a322b);background:var(--surface,#16120e);color:var(--ink,#edebe7);text-decoration:none;cursor:pointer}
button:focus-visible,a.knapp:focus-visible{outline:2px solid var(--accent,#c58e5a);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>Du er uten nett</h1>
<p>Denne siden er ikke lagret på enheten ennå, så den kan ikke vises uten nett.</p>
<p>Sider du har besøkt før, og forsiden, virker også uten nett.</p>
<div class="knapper">
<button type="button" onclick="location.reload()">Prøv igjen</button>
<a class="knapp" href="/">Til forsiden</a>
</div>
</main>
</body>
</html>
